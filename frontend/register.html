<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel ="stylesheet" href = "css/style.css">
</head>
<body class="auth-page">
    
    <div class="container">
        <h2>Criar conta</h2>

        <form id="registerForm">
            <div class="input-group">
                <label for="fullName">Nome completo</label>
                <input type="text" id="fullName" required placeholder="Digite o seu nome completo">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="text" id="email" required placeholder="Digite seu e-mail">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Crie uma senha">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" required placeholder="Repita sua senha">
            </div>

            <div id="registerMessage" class="form-message"></div>
            <button type="submit">Cadastrar</button>

        </form>

        <p>Já tem uma conta? <a href="index.html">Faça login aqui</a></p>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
