<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page" style="display: none;">

    <div class="dashboard-header">
        <h1 id="welcomeMessage">Carregando...</h1>
        <button id="logoutBtn" class="logout-button">Logout</button>
    </div>

    <main class="dashboard-main">
        <div id="audiobookList" class="dashboard-card">
            <h2>Biblioteca de Audiobooks</h2>
            <ul id="booksContainer"></ul>
        </div>

        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h2>Painel do Administrador - Upload de PDF</h2>
            <form id="uploadForm" class="upload-form">
                <input type="file" id="pdfFiles" accept=".pdf" multiple required>
                <button type="submit" class="primary-button">Fazer Upload</button>
                <progress id="uploadProgress" value="0" max="100" class="upload-progress"></progress>
            </form>

            <div id="permissionPanel" class="permission-panel">
                <h3>Gerenciar Acesso a Audiobooks</h3>
                <div id="permissionMessage" class="permission-message"></div>
                <div class="permission-row">
                    <div class="permission-field">
                        <label for="audiobookSelect">Audiobook</label>
                        <select id="audiobookSelect"></select>
                    </div>
                </div>
                <div class="permission-row">
                    <div class="permission-field">
                        <label for="userSearch">Buscar usuário</label>
                        <input id="userSearch" type="text" placeholder="Nome ou e-mail" />
                    </div>
                    <button id="toggleUsersBtn" type="button" class="secondary-button small-button">Ocultar lista</button>
                </div>
                <div class="permission-action-row">
                    <button id="grantAccessBtn" type="button" class="primary-button small-button">Conceder acesso</button>
                    <button id="revokeAccessBtn" type="button" class="danger-button small-button">Revogar acesso</button>
                </div>
                <div id="usersWrapper" class="users-wrapper">
                    <div id="usersList" class="users-list"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="audio-player" id="audioPlayerContainer" style="display: none;">
        <div id="nowPlaying">Nenhuma faixa selecionada</div>
        <audio id="mainAudio" controls>
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
