<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h2>Entrar</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Digite seu e-mail">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Digite sua senha">
            </div>

            <div id="loginMessage" class="form-message"></div>
            <button type="submit">Entrar</button>
        </form>

        <p>Não tem uma conta? <a href="register.html">Cadastre-se aqui</a></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
